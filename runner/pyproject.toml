[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "teeter-runner"
dynamic = ["version"]
description = "Runs Teeter campaigns on your machines: your robot and your policy never leave them"
requires-python = ">=3.10"
license = {text = "UNLICENSED"}
dependencies = [
  "faultline-harness>=0.3.0",
  "httpx>=0.28,<0.29",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "teeter-api", "uvicorn>=0.32"]

[project.scripts]
teeter = "teeter_runner.cli:main"

[tool.setuptools]
packages = ["teeter_runner"]

[tool.setuptools.dynamic]
version = {attr = "teeter_runner.__version__"}
