# Every push and pull request: the three test suites (the API's on SQLite and
# on Postgres), the published record against the engine, and the two images
# brought up together with a gate run through them.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness:
    name: engine
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: harness/pyproject.toml
      - run: pip install -e "harness[dev]"
      - name: Tests
        working-directory: harness
        run: python -m pytest tests -q
      - name: The published record is what the engine produces today
        run: python tools/publish_campaign.py --check

  api:
    name: control plane
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: teeter
          POSTGRES_PASSWORD: teeter-ci
          POSTGRES_DB: teeter_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U teeter -d teeter_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEETER_TEST_DATABASE_URL: postgresql+psycopg://teeter:teeter-ci@127.0.0.1:5432/teeter_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: "*/pyproject.toml"
      # the engine too: the contract tests hold the API's axis and signal
      # tables to the engine's own
      - run: |
          pip install -e "harness[dev]"
          pip install -e "api[dev]"
      - name: Tests, SQLite and Postgres
        working-directory: api
        run: python -m pytest tests -q

  runner:
    name: runner
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: "*/pyproject.toml"
      # in order, so each local package is found here and never on an index
      - run: |
          pip install -e "harness[dev]"
          pip install -e "api[dev]"
          pip install -e "runner[dev]"
      - name: Tests, against a real API on real physics
        working-directory: runner
        run: python -m pytest tests -q

  stack:
    name: images and stack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the API and runner images
        run: docker compose build
      - name: Bring up Postgres, the API and a runner
        run: docker compose up -d --wait api runner
      - name: A gate through the stack blocks the demo's tall-v2, as it does locally
        run: |
          set +e
          docker compose run --rm -T runner gate --api http://api:8000 \
            --token-file /data/ci-token --program quadruped --checkpoint tall-v2
          code=$?
          set -e
          test "$code" -eq 1
      - name: The app and the API answer
        run: |
          curl -fsS http://127.0.0.1:8000/v1/health
          curl -fsS -o /dev/null http://127.0.0.1:8000/app/
      - name: Logs
        if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
