[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "faultline-harness"
dynamic = ["version"]
description = "Adversarial testing for learned robot control policies"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "UNLICENSED"}

# Pinned exactly, not loosely. Contact solvers change between MuJoCo minor
# versions, and a campaign that cannot be re-run on the same physics is not
# evidence.
dependencies = [
  "mujoco==3.12.0",
  "numpy>=2.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
faultline = "faultline.cli:main"

[tool.setuptools]
packages = ["faultline"]

# one source of truth for the version
[tool.setuptools.dynamic]
version = {attr = "faultline.__version__"}

[tool.setuptools.package-data]
faultline = ["../models/*.xml"]
